name: Fork Check

on:
  push:
    branches: [ecopaste]
  pull_request:
    branches: [ecopaste]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_TEST_INCREMENTAL: 'false'

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check integration surface
        run: cargo check -p iroh --lib --locked --no-default-features --features tls-ring,portmapper
      - name: GSO regression
        if: runner.os == 'Linux'
        run: cargo test -p iroh --lib --locked --no-default-features --features tls-ring,portmapper open_senders_stop_batching_after_a_refused_segmented_send
      - name: Update overlay regression
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s ecopaste/tests -p 'test_*.py'

  android:
    name: Android release check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Configure the Android NDK
        run: |
          sdkmanager 'ndk;29.0.14206865'
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Check Android library and regressions
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: cargo check -p iroh --lib --tests --target aarch64-linux-android --release --locked --no-default-features --features tls-ring,portmapper

  validation:
    name: Fork validation
    if: always()
    needs: [native, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require all native checks
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: test "$NATIVE_RESULT" = success && test "$ANDROID_RESULT" = success
