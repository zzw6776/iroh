name: Fork Check

on:
  push:
    branches: [ecopaste]
  pull_request:
    branches: [ecopaste]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_TEST_INCREMENTAL: 'false'

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Check integration surface
        run: cargo check -p iroh --lib --locked --no-default-features --features tls-ring,portmapper
      - name: GSO regression
        if: runner.os == 'Linux'
        run: cargo test -p iroh --lib --locked --no-default-features --features tls-ring,portmapper open_senders_stop_batching_after_a_refused_segmented_send
      - name: Update overlay regression
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s ecopaste/tests -p 'test_*.py'

  validation:
    name: Fork validation
    if: always()
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Require all native checks
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
